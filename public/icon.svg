<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="tf-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#EA580C" />
      <stop offset="40%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#FDE047" />
    </linearGradient>
    <linearGradient id="tf-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#FBBF24" />
    </linearGradient>
    <linearGradient id="tf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#F59E0B" stopOpacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#tf-bg)" stroke="url(#tf-border)" stroke-width="12"/>

  <!-- Anvil / Audio Soundboard Base -->
  <path d="M 120 390 Q 256 375 392 390 Q 402 400 388 410 Q 256 420 124 410 Q 110 400 120 390 Z" fill="#D97706" opacity="0.85"/>

  <!-- Equalizer Bar 1 -->
  <rect x="100" y="246" width="42" height="124" rx="21" fill="url(#tf-gold)" opacity="0.75"/>

  <!-- Equalizer Bar 2 -->
  <rect x="168" y="180" width="42" height="190" rx="21" fill="url(#tf-gold)" opacity="0.9"/>

  <!-- Equalizer Bar 3 (Apex) -->
  <rect x="235" y="122" width="42" height="248" rx="21" fill="url(#tf-gold)"/>

  <!-- Equalizer Bar 4 -->
  <rect x="302" y="180" width="42" height="190" rx="21" fill="url(#tf-gold)" opacity="0.9"/>

  <!-- Equalizer Bar 5 -->
  <rect x="370" y="246" width="42" height="124" rx="21" fill="url(#tf-gold)" opacity="0.75"/>

  <!-- Golden 4-Point Star Spark -->
  <path d="M 256 50 Q 256 86 292 86 Q 256 86 256 122 Q 256 86 220 86 Q 256 86 256 50 Z" fill="url(#tf-spark)"/>
  <circle cx="256" cy="86" r="8" fill="#FFFFFF"/>
</svg>
